faq:
  surtitre: "Questions fréquentes"
  titre: "Tout savoir sur nos DJs événementiels"
  intro: "Les réponses aux questions que l'on nous pose le plus souvent avant de réserver un DJ pour un événement."
  questions:
    - question: "Quels types d'événements Groove Caviar anime-t-il ?"
      reponse: |
        Groove Caviar anime les cocktails et réceptions, vernissages et expositions, inaugurations et lancements de produit, défilés de mode, événements sportifs, fêtes et festivals, ainsi que les foires et salons professionnels. Basée à Biarritz, l'agence intervient aussi pour les mariages et les soirées privées.

    - question: "Combien coûte un DJ pour un événement d'entreprise à Biarritz ?"
      reponse: |
        Le tarif dépend de la durée de la prestation, de la date, du lieu et du matériel nécessaire. Chaque événement étant différent, Groove Caviar établit un devis sur-mesure, gratuit et sans engagement, envoyé sous 72h ouvrées après votre [demande de devis](/devis/booking-dj).

    - question: "Fournissez-vous la sonorisation et l'éclairage ?"
      reponse: |
        Selon votre événement, oui : nous pouvons fournir la régie DJ, une sonorisation adaptée à votre lieu et à votre nombre d'invités, un micro sans fil pour les discours et, en option, l'éclairage. Nous pouvons aussi nous intégrer à la sonorisation de votre lieu ou de votre prestataire technique.

    - question: "Intervenez-vous en dehors du Pays Basque ?"
      reponse: |
        Oui. Basé à Biarritz, Groove Caviar intervient dans tout le Sud-Ouest, partout en France et à l'international.

    - question: "Le DJ peut-il suivre le programme minuté d'un défilé ou d'un lancement ?"
      reponse: |
        Oui. Nous calons la musique sur votre déroulé (entrées, discours, révélations, temps forts) et travaillons avec vos équipes de production et de régie pour que chaque moment soit synchronisé.

    - question: "Quelle musique pour un cocktail, une inauguration ou un événement d'entreprise ?"
      reponse: |
        Une ambiance sobre pendant l'accueil et les échanges, puis une montée en énergie progressive si vous le souhaitez. Nous définissons avec vous l'ambiance, les morceaux à privilégier et ceux à éviter.

    - question: "Un DJ peut-il jouer en extérieur ?"
      reponse: |
        Cela dépend du lieu : nous intervenons de préférence sous abri (chapiteau, barnum, terrasse couverte) avec une alimentation électrique. Contactez-nous en amont : nous étudions ensemble les conditions de votre événement et ce qui est possible.

    - question: "Combien de temps à l'avance faut-il réserver ?"
      reponse: |
        Le plus tôt possible : les périodes de salons, de festivals et de fin d'année se remplissent vite. Pour un événement d'envergure, nous conseillons de nous contacter plusieurs mois à l'avance.

    - question: "Comment demander un devis pour un événement ?"
      reponse: |
        Remplissez notre [formulaire de demande de devis](/devis/booking-dj) en quelques minutes, ou contactez-nous au 06 23 62 57 04 ou par e-mail à contact@groovecaviar.com. Nous revenons vers vous sous 72h ouvrées avec une proposition personnalisée, gratuite et sans engagement.

