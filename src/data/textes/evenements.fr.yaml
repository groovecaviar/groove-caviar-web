# ══════════════════════════════════════════════════════════════════════
#  PAGE « ÉVÉNEMENTS » — TEXTES FRANÇAIS  (adresse : /evenements)
# ══════════════════════════════════════════════════════════════════════
#  Comment modifier :
#   • Change le texte après les deux-points, puis enregistre (Cmd + S).
#     Avec « npm run dev », la page se met à jour toute seule dans le navigateur.
#   • Ne modifie PAS les mots-clés à gauche (titre:, texte:, liens:…),
#     ni les tirets « - », ni le décalage (les espaces en début de ligne).
#   • Les textes longs sont sous un « | » : écris librement en dessous,
#     en gardant le même décalage. Une ligne vide = un nouveau paragraphe.
#
#  Mise en forme automatique (rien à faire) :
#   • « Groove Caviar » s'affiche toujours en doré (classe .brand).
#   • Les espaces insécables avant ? ! : ; » et après « sont ajoutées.
#   • **mot** → mot en gras.      [texte du lien](/adresse) → lien.
#
#  Sections : l'ordre des sections ci-dessous = l'ordre sur la page
#  (numéros 01, 02… recalculés automatiquement).
#  Liens « liens: » vers les sous-pages : ils n'apparaissent QUE lorsque
#  la sous-page existe — inutile de les retirer en attendant.
#  « photo: » doit rester l'un de :
#     cocktail, vernissage, lancement, defile, sportif, festival, salon
# ══════════════════════════════════════════════════════════════════════

