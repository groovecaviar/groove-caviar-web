intro:
  titre: "Des événements qui marquent les esprits"
  texte: |
    Cocktail, vernissage, inauguration, défilé, salon professionnel, compétition sportive ou festival : Groove Caviar crée l'ambiance sonore de vos événements, à Biarritz, au Pays Basque et partout en France. Des DJs professionnels qui font vibrer votre public, une direction musicale pensée pour votre image et, si vous le souhaitez, la sonorisation et l'éclairage adaptés à votre lieu : de la préparation au dernier invité, nous vous accompagnons avec l'exigence d'une agence haut de gamme.

