faq:
  surtitre: "Frequently asked questions"
  titre: "Everything about our event DJs"
  intro: "Answers to the questions we are asked most often before booking a DJ for an event."
  questions:
    - question: "What kinds of events does Groove Caviar cover?"
      reponse: |
        Groove Caviar provides DJs for cocktails and receptions, exhibition openings, inaugurations and product launches, fashion shows, sporting events, parties and festivals, as well as trade fairs and professional exhibitions. Based in Biarritz, the agency also covers weddings and private parties.

    - question: "How much does a DJ for a corporate event in Biarritz cost?"
      reponse: |
        The price depends on the length of the set, the date, the venue and the equipment required. As every event is different, Groove Caviar prepares a bespoke quote, free and with no obligation, sent within 72 business hours of your [quote request](/en/quote/dj-booking).

    - question: "Do you provide the sound and lighting?"
      reponse: |
        Depending on your event, yes: we can provide the DJ booth, a sound system suited to your venue and guest count, a wireless microphone for speeches and, as an option, lighting. We can also plug into the sound system of your venue or technical provider.

    - question: "Do you work outside the Basque Country?"
      reponse: |
        Yes. Based in Biarritz, Groove Caviar works across the South West, throughout France and internationally.

    - question: "Can the DJ follow the timed running order of a fashion show or a launch?"
      reponse: |
        Yes. We time the music to your running order (entrances, speeches, reveals, highlights) and work with your production and technical teams so that every moment is in sync.

    - question: "What music works for a cocktail, an inauguration or a corporate event?"
      reponse: |
        A refined atmosphere during the welcome and conversations, then a gradual lift in energy if you wish. We define with you the mood, the tracks to favour and the ones to avoid.

    - question: "Can a DJ play outdoors?"
      reponse: |
        It depends on the venue: we prefer to play under cover (marquee, tent, covered terrace) with a power supply. Get in touch in advance and we will look at the conditions of your event together.

    - question: "How far in advance should we book?"
      reponse: |
        As early as possible: trade-fair seasons, festival periods and the festive season fill up fast. For a large-scale event, we recommend contacting us several months ahead.

    - question: "How do I request a quote for an event?"
      reponse: |
        Fill in our [quote request form](/en/quote/dj-booking) in a few minutes, or contact us on +33 6 23 62 57 04 or by email at contact@groovecaviar.com. We get back to you within 72 business hours with a personalised proposal, free and with no obligation.

