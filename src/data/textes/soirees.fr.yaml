  texte: |
    Soirée d'entreprise, fête privée, bar, club ou réveillon : Groove Caviar fournit des DJs professionnels et le matériel son et lumière adapté à chaque lieu, à Biarritz, au Pays Basque, dans les Landes et partout en France. Direction musicale sur-mesure, lecture de piste en temps réel, exigence de service haut de gamme : de la préparation au dernier morceau, nous nous occupons de tout.

