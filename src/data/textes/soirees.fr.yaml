faq:
  surtitre: "Questions fréquentes"
  titre: "Tout savoir sur nos DJs de soirée"
  intro: "Les réponses aux questions que l'on nous pose le plus souvent avant de réserver un DJ pour une soirée."
  questions:
    - question: "Combien coûte un DJ pour une soirée à Biarritz ou au Pays Basque ?"
      reponse: |
        Le tarif d'un DJ de soirée dépend de la durée de la prestation, de la date, du lieu et du matériel son et lumière nécessaire. Chaque soirée étant différente, Groove Caviar établit un devis sur-mesure, gratuit et sans engagement, envoyé sous 72h ouvrées après votre [demande de devis](/devis/booking-dj).

    - question: "Quels types de soirées anime Groove Caviar ?"
      reponse: |
        Groove Caviar anime les soirées d'entreprise et séminaires, les soirées privées, anniversaires et bar-mitzvah, les soirées en bars, hôtels et restaurants, les soirées en clubs et discothèques, ainsi que les réveillons du Nouvel An. Basée à Biarritz, l'agence intervient aussi pour les mariages et les événements de marque.

    - question: "Dans quelles villes intervenez-vous pour une soirée ?"
      reponse: |
        Basé à Biarritz, Groove Caviar intervient dans tout le Pays Basque et le Sud-Ouest : Bayonne, Anglet, Saint-Jean-de-Luz, Guéthary, ainsi que dans les Landes (Hossegor, Seignosse, Capbreton) et jusqu'à Bordeaux. Nos DJs se déplacent également partout en France et à l'international.

    - question: "Le matériel son et lumière est-il fourni ?"
      reponse: |
        Oui. Pour les soirées privées et d'entreprise, nous fournissons la régie DJ professionnelle, une sonorisation adaptée à votre lieu et à votre nombre d'invités, et un micro sans fil pour les discours. L'éclairage de piste, la mise en lumière architecturale et d'autres options peuvent être ajoutés. L'installation et le démontage sont assurés par nos soins.

    - question: "Peut-on choisir la musique de sa soirée ?"
      reponse: |
        Oui. Avant la soirée, nous échangeons avec vous par téléphone ou lors d'un rendez-vous pour définir l'ambiance, vos morceaux favoris et ceux à éviter. Le jour J, le DJ construit son set en temps réel selon l'énergie de vos invités : pas de playlist figée, mais une vraie direction musicale, de la pop au disco, de la soul à la house.

    - question: "Pouvez-vous animer une soirée chez un particulier ?"
      reponse: |
        Oui. Maison, villa, jardin, bord de piscine ou location de vacances : Groove Caviar installe un DJ à domicile avec un matériel discret, adapté aux espaces privés, en intérieur comme en extérieur. Le volume est réglé selon le lieu et le voisinage, de l'apéritif jusqu'à la piste de danse.

    - question: "Proposez-vous des DJs pour les bars, restaurants et clubs ?"
      reponse: |
        Oui. Grâce à son réseau artistique, Groove Caviar place des DJs dans les bars, hôtels, restaurants et discothèques, pour une soirée ponctuelle ou une résidence régulière. Nous sélectionnons les artistes selon votre lieu, votre clientèle et votre budget, et pouvons concevoir des concepts de soirées complets.

    - question: "Combien de temps à l'avance faut-il réserver son DJ ?"
      reponse: |
        Le plus tôt possible : les week-ends d'été et les fêtes de fin d'année partent vite. Pour le réveillon du 31 décembre, date la plus demandée de l'année, nous conseillons de réserver plusieurs mois à l'avance.

    - question: "Comment demander un devis pour une soirée ?"
      reponse: |
        Remplissez notre [formulaire de demande de devis](/devis/booking-dj) en quelques minutes, ou contactez-nous au 06 23 62 57 04 ou par e-mail à contact@groovecaviar.com. Nous revenons vers vous sous 72h ouvrées avec une proposition personnalisée, gratuite et sans engagement.

