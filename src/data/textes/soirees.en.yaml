faq:
  surtitre: "Frequently asked questions"
  titre: "Everything about our party DJs"
  intro: "Answers to the questions we are asked most often before booking a DJ for a party."
  questions:
    - question: "How much does a party DJ cost in Biarritz or the Basque Country?"
      reponse: |
        The price of a party DJ depends on the length of the set, the date, the venue and the sound and lighting required. As every party is different, Groove Caviar prepares a bespoke quote, free and with no obligation, sent within 72 business hours of your [quote request](/en/quote/dj-booking).

    - question: "What kinds of parties does Groove Caviar cover?"
      reponse: |
        Groove Caviar provides DJs for corporate parties and seminars, private parties, birthdays and bar mitzvahs, bars, hotels and restaurants, clubs and nightclubs, as well as New Year's Eve. Based in Biarritz, the agency also covers weddings and brand events.

    - question: "Which areas do you cover for parties?"
      reponse: |
        Based in Biarritz, Groove Caviar covers the whole Basque Country and South West of France: Bayonne, Anglet, Saint-Jean-de-Luz, Guéthary, the Landes (Hossegor, Seignosse, Capbreton) and as far as Bordeaux. Our DJs also travel across France and internationally.

    - question: "Is sound and lighting equipment provided?"
      reponse: |
        Yes. For private and corporate parties, we provide a professional DJ booth, a sound system suited to your venue and guest count, and a wireless microphone for speeches. Dancefloor lighting, architectural lighting and other options can be added. Set-up and breakdown are handled by our team.

    - question: "Can we choose the music for our party?"
      reponse: |
        Yes. Before the event, we talk with you by phone or in person to define the atmosphere, your favourite tracks and the ones to avoid. On the night, the DJ builds the set in real time around your guests' energy: no fixed playlist, but genuine music direction, from pop to disco, from soul to house.

    - question: "Can you play a party at a private home?"
      reponse: |
        Yes. House, villa, garden, poolside or holiday rental: Groove Caviar sets up a DJ at your home with discreet equipment designed for private spaces, indoors and outdoors. The volume is adjusted to the venue and the neighbours, from the aperitif to the dancefloor.

    - question: "Do you provide DJs for bars, restaurants and clubs?"
      reponse: |
        Yes. Through its artist network, Groove Caviar places DJs in bars, hotels, restaurants and nightclubs, for a one-off night or a regular residency. We select artists to match your venue, your clientele and your budget, and can design complete party concepts.

    - question: "How far in advance should we book a DJ?"
      reponse: |
        As early as possible: summer weekends and the festive season fill up fast. For New Year's Eve, the busiest night of the year, we recommend booking several months ahead.

    - question: "How do I request a quote for a party?"
      reponse: |
        Fill in our [quote request form](/en/quote/dj-booking) in a few minutes, or contact us on +33 6 23 62 57 04 or by email at contact@groovecaviar.com. We get back to you within 72 business hours with a personalised proposal, free and with no obligation.

