# ── 12. FAQ (questions-réponses, très utiles pour Google et les IA) ────
faq:
  surtitre: "Questions fréquentes"
  titre: "Tout savoir sur votre DJ de mariage"
  questions:
    - question: "Combien coûte un DJ de mariage à Biarritz ?"
      reponse: |
        Chez Groove Caviar, une prestation complète de DJ pour un mariage démarre à 1 999 € en haute saison (d'avril à octobre), avec des tarifs préférentiels hors saison. Elle comprend la musique du vin d'honneur à la fin de soirée, la sonorisation, l'éclairage de piste, un micro sans fil et la préparation de votre soirée. Chaque mariage étant unique, le tarif dépend de votre lieu, de la durée et des options choisies : nous vous envoyons un devis personnalisé, gratuit et sans engagement, sous 72 h ouvrées après votre [demande de devis](/devis/mariages).

    - question: "Que comprend la prestation complète ?"
      reponse: |
        La musique du vin d'honneur jusqu'à la fin de soirée, le matériel DJ professionnel, la sonorisation du dîner et de la soirée, la sonorisation du cocktail, l'éclairage de la piste de danse façon club, un micro sans fil pour les discours, la préparation de votre soirée, un rendez-vous préparatoire, l'installation, le démontage et les frais de déplacement.

    - question: "Combien de temps à l'avance faut-il réserver son DJ de mariage ?"
      reponse: |
        Dès que votre date et votre lieu sont fixés : les samedis de mai à septembre sont les plus demandés et partent vite. Hors saison, nous avons généralement plus de disponibilités, à des tarifs préférentiels.

    - question: "Comment réserver notre date ?"
      reponse: |
        Remplissez notre [formulaire de demande de devis](/devis/mariages). Nous vérifions la disponibilité de votre date et vous envoyons un devis personnalisé sous 72 h ouvrées. Votre date est ensuite bloquée à la signature du contrat et au versement d'arrhes de 400 €.

    - question: "Pouvez-vous jouer en extérieur, en jardin ou en terrasse ?"
      reponse: |
        Oui : le vin d'honneur se déroule souvent en terrasse ou dans les jardins des châteaux, et nous y installons notre sonorisation. Le DJ et le matériel doivent simplement être à l'abri des intempéries : en cas de pluie, prévoyez un abri (barnum, tonnelle, préau ou terrasse couverte).

    - question: "Que se passe-t-il si votre DJ a un empêchement ?"
      reponse: |
        En plus de dix ans, Groove Caviar n'a jamais manqué une date. En cas d'imprévu grave de dernière minute, nous faisons appel à notre réseau de DJs professionnels de confiance pour assurer votre soirée.

    - question: "Peut-on choisir les morceaux, et ceux à ne pas passer ?"
      reponse: |
        Bien sûr. Lors du rendez-vous préparatoire, nous définissons ensemble l'ambiance de chaque moment, vos morceaux incontournables et ceux à ne jamais passer. Le jour J, le DJ construit ses enchaînements en direct selon l'énergie de vos invités. Pour vous inspirer, découvrez nos [playlists mariages](/musique#playlists-mariages).

    - question: "Proposez-vous des musiciens pour le cocktail ?"
      reponse: |
        Oui : un saxophoniste, un percussionniste, ou les deux, peuvent accompagner le DJ en live pendant le vin d'honneur, et le saxophoniste aussi pendant la soirée (sous réserve de disponibilité). Nous pouvons aussi vous proposer des groupes live ou des bandas et nous les relayons dès qu'ils font leurs pauses afin que la musique ne s'arrête pas.

    - question: "Parlez-vous anglais et espagnol pour un mariage international ?"
      reponse: |
        Oui. Nous accueillons vos invités et faisons les annonces en français, en anglais ou en espagnol, et nous construisons une programmation qui rassemble toutes les cultures présentes.

    - question: "Dans quelles villes intervenez-vous ?"
      reponse: |
        Basé à Biarritz, Groove Caviar anime des mariages à Biarritz, Anglet et Bayonne, sur toute la Côte basque (Saint-Jean-de-Luz, Guéthary, Bidart, Arcangues…), dans le Pays Basque intérieur, dans les Landes (Hossegor, Seignosse, Capbreton) et partout en France et à l'international.

    # ⚠️ Question à compléter si tu veux : jusqu'à quelle heure jouez-vous ? Heures supplémentaires ?

