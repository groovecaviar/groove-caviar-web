# ══════════════════════════════════════════════════════════════════════
#  PAGE « MARIAGES » — TEXTES FRANÇAIS  (adresse : /mariages)
# ══════════════════════════════════════════════════════════════════════
#  Comment modifier :
#   • Change le texte après les deux-points, puis enregistre (Cmd + S).
#   • Ne modifie PAS les mots-clés à gauche (titre:, texte:, options:…),
#     ni les tirets « - », ni le décalage (les espaces en début de ligne).
#   • Les textes longs sont sous un « | » : écris librement en dessous,
#     en gardant le même décalage. Une ligne vide = un nouveau paragraphe.
#   • Les lignes qui commencent par « # » sont des notes pour toi :
#     elles n'apparaissent pas sur le site.
#   • ⚠️ = point à vérifier ou à compléter.
#
#  Mise en forme automatique (rien à faire) :
#   • « Groove Caviar » s'affiche toujours en doré (classe .brand).
#   • Les espaces insécables avant ? ! : ; » et après « sont ajoutées.
#   • **mot** → mot en gras.      [texte du lien](/adresse) → lien.
#   • {google_avis} : remplacé partout sur la page par
#     les chiffres de la rubrique « compteurs_avis » juste en dessous.
#     → Tu n'as qu'UN endroit à mettre à jour (par exemple à chaque dizaine).
#
#  Mots-clés visés (référencement) : DJ mariage Biarritz, Anglet, Bayonne,
#  meilleur DJ mariage. Le Pays Basque élargi et les Landes auront leurs
#  propres pages : ici on reste centré sur Biarritz / Anglet / Bayonne.
# ══════════════════════════════════════════════════════════════════════

# ── COMPTEURS D'AVIS (à mettre à jour toi-même de temps en temps) ──────
#  Écris le nombre arrondi : « 150 » s'affichera « plus de 150 avis ».
compteurs_avis:
  google_avis: "60"

seo:
  # Titre et description affichés dans Google (pas visibles sur la page).
  # Titre : 60 caractères maximum. Description : 155 caractères environ.
  titre: "DJ mariage Biarritz, Anglet & Bayonne | Groove Caviar"
  description: "DJ de mariage à Biarritz, Anglet et Bayonne : plus de 150 mariages, sono et éclairage inclus, DJs trilingues. Côte basque, Landes, international. Devis 72 h."

# ── 1. HERO (grande photo d'ouverture) ─────────────────────────────────
hero:
  surtitre: "Biarritz · Anglet · Bayonne · Pays Basque"
  titre_blanc: "DJ"
  titre_or: "Mariage"

# ── 2. CHIFFRES CLÉS (bandeau noir) ────────────────────────────────────
chiffres:
  - valeur: "10+"
    libelle: "ans de mariages"
  - valeur: "150+"
    libelle: "mariages animés"
  - valeur: "25000+"
    libelle: "morceaux hi-fi"
  - valeur: "0"
    libelle: "date manquée"

# ── 3. INTRO (réponse directe pour Google et les IA) ───────────────────
intro:
  # Un retour à la ligne dans le titre = un retour à la ligne à l'écran
  titre: |
    Votre DJ de mariage
    au Pays Basque
  texte: |
    Groove Caviar est une agence de DJs basée à Biarritz. Depuis plus de dix ans et plus de 150 mariages, nos DJs font danser vos invités du vin d'honneur au dernier morceau, à Biarritz, Anglet et Bayonne, sur toute la Côte basque, dans les Landes et à l'international. Direction musicale sur mesure, lecture de piste en temps réel, échanges en français, en anglais ou en espagnol : votre mariage mérite la bonne bande-son.

# ── 4. LE DÉROULÉ, DU JOUR À LA NUIT ───────────────────────────────────
deroule:
  surtitre: "Le déroulé"
  titre_blanc: "De l'arrivée des invités"
  titre_or: "au dernier morceau"
  texte: "Chaque moment de votre journée a sa musique. Nous la construisons avec vous, pour une ambiance à votre image."
  note: "Horaires donnés à titre indicatif : nous suivons le déroulé de votre journée."
  moments:
    - heure: "17h · Cérémonie laïque"
      titre: "Le moment du « oui »"
      texte: |
        Entrée des mariés, échange des vœux, sortie sous les applaudissements : chaque morceau est choisi avec vous, et un micro sans fil porte la voix de vos officiants, proches et témoins.
      etiquettes:
        - "Sonorisation de cérémonie + micro"
      ecoute:
        texte: "Écouter · sélection pour entrée de cérémonie"
        lien: "https://open.spotify.com/playlist/0cbcwEudFVe8kC8oDMpGQJ"
      image_alt: "Cérémonie laïque en musique lors d'un mariage à Biarritz"

    - heure: "18h · Vin d'honneur"
      titre: "Le cocktail, en live"
      texte: |
        Bossa nova, soul, jazz : une ambiance élégante qui accompagne les retrouvailles sans couvrir les conversations. Pour un moment inoubliable, un saxophoniste, un percussionniste, ou les deux, jouent en live avec le DJ.
      etiquettes:
        - "Saxophoniste live"
        - "Percussionniste live"
      ecoute:
        texte: "Écouter · cocktail mix bossa nova"
        lien: "https://www.mixcloud.com/groovecaviar/groove-caviar-cocktail-mix-bossa-nova-mariage-wedding/"
      image_alt: "Saxophoniste et DJ pendant le vin d'honneur d'un mariage au Pays Basque"

    - heure: "20h30 · Dîner"
      titre: "Le dîner, en douceur"
      texte: |
        Un mix feutré qui occupe le silence sans prendre de place et n'oblige pas les convives à élever la voix. Entrée en salle, discours, vidéos, présentation de dessert : nous orchestrons les temps forts avec vous, le lieu et le traiteur.
      ecoute:
        texte: "Écouter · dinner mix smooth jazz"
        lien: "https://www.mixcloud.com/groovecaviar/dinner-mix-urban-smooth-jazz-mariage-wedding/"
      image_alt: "Dîner de mariage en musique dans un château près de Biarritz"

    - heure: "23h30 · Ouverture de bal"
      titre: "Votre première danse"
      texte: |
        Telle que vous l'avez rêvée : version originale, remix ou enchaînement surprise, préparé ensemble. Et pour un moment magique, nous pouvons vous faire danser sur un nuage ou entourés d'étincelles.
      etiquettes:
        - "Option · nuage de fumée lourde"
        - "Option · jets d'étincelles"
      ecoute:
        texte: "Écouter · sélection première danse"
        lien: "https://open.spotify.com/playlist/01QXNfwZ3GlEScDuaNIonN"
      image_alt: "Ouverture de bal des mariés sur un nuage de fumée lourde"

    - heure: "Minuit · Soirée"
      titre: "Jusqu'au bout de la nuit"
      texte: |
        Disco, funk, house, des années 80 à aujourd'hui : notre DJ lit la piste en temps réel et fait danser toutes les générations, jusqu'au dernier morceau.
      ecoute:
        texte: "Écouter · party mix soul × funk × disco"
        lien: "https://www.mixcloud.com/groovecaviar/party-mix-soul-x-funk-x-disco-mariage-wedding/"
      # Petite citation d'avis sous ce moment (initiales uniquement) :
      citation:
        texte: "Personne ne voulait quitter la piste de danse."
        auteur: "M. & A. · Mariage 2025"
      image_alt: "Piste de danse pleine lors d'une soirée de mariage animée par Groove Caviar"

    - heure: "4h · Dernier morceau"
      titre: "La touche finale"
      texte: |
        Du traditionnel "Les lacs du Connemara" à "The time of my life" de Dirty Dancing, libre à vous de choisir la chanson parfaite pour ce bouquet final plein d'amour qui marquera la fin d'une soirée mémorable.
      ecoute:
        texte: "Écouter · sélection dernier morceau"
        lien: "https://open.spotify.com/playlist/3S5KGTMxWi0e6o36dJiGsf"
      image_alt: "Une fin de soirée pleine d'amour"

# ── VIDÉO (bandeau pleine largeur après le déroulé) ───────────────────
video:
  # Description lue par les lecteurs d'écran (la vidéo est muette)
  description: "Une soirée de mariage Groove Caviar en vidéo : platines, piste de danse et invités en fête."
  credit: "Vidéo : Quentin Vanden"
  credit_lien: "http://videaste432hz.com/"

# ── 5. AVIS ────────────────────────────────────────────────────────────
avis:
  surtitre: "Ils nous ont dit oui"
  titre_blanc: "Les mots"
  titre_or: "de nos mariés"
  google_libelle: "Plus de {google_avis} avis sur Google"
  bouton: "Lire nos avis sur Google"
  # AVIS : initiales uniquement. Un paragraphe = un bloc séparé par une ligne vide.
  #    « portrait: » = nom du fichier photo du couple (avis « à la une » uniquement,
  #    dans src/assets/images/avis/ sous la forme avis-<nom>.webp).
  #    Les avis longs du mur sont repliés automatiquement avec « Lire la suite ».
  a_la_une:
    - initiales: "M. & H."
      date: "Mariage · juillet 2025"
      source: google
      portrait: marie-hugo
      texte: |
        Nous avons célébré notre mariage le samedi 26 juillet 2025 et avons eu la chance d'être accompagnés par Pierre, qui a assuré la sonorisation de notre cérémonie laïque, du vin d'honneur, du repas et de la soirée.

        Tout a été parfaitement maîtrisé du début à la fin. Pierre a fait preuve d'une gentillesse et d'une bonne humeur communicatives, tout en nous prodiguant de précieux conseils tout au long des préparatifs et le jour J.

        Résultat : une journée magique et une soirée dansante inoubliable ! Nos invités nous ont répété à quel point ils s'étaient amusés. L'ambiance n'est jamais retombée, et la piste de danse est restée pleine, de la première danse jusqu'à la dernière, à 4 h du matin.

        Si vous voulez profiter pleinement de votre mariage et avoir un prestataire de confiance, vous pouvez confier votre événement à Pierre les yeux fermés ! (Plusieurs de nos invités nous ont même demandé ses coordonnées pour leurs propres événements.)
    - initiales: "M. & S."
      date: "Mariage · septembre 2023"
      source: google
      portrait: marine-selim
      texte: |
        Pierre a animé notre mariage – cérémonie, cocktail, dîner et soirée – et pour faire court, c'était parfait de A à Z !

        Il a su nous accompagner et distiller de bons conseils dans toutes les phases de préparation de sa prestation. Il est à l'écoute de vos besoins, respectueux de vos goûts, très professionnel, mais aussi, disons-le, très sympathique.

        Quand vous préparez un grand événement et que la musique y joue un rôle important, c'est bon de se sentir à l'aise et en confiance, comme ça a été le cas avec Pierre.

        On ne s'est pas trompés : il nous a régalés, ainsi que tous nos convives, qui ont souligné la qualité de ses sets et des choix musicaux.

        Recommandé à 100 % sans une once d'hésitation.
    - initiales: "M. & C."
      date: "Mariage · septembre 2021"
      source: google
      portrait: marion-clement
      texte: |
        Pierre nous a fait passer une soirée exceptionnelle pour notre mariage, en faisant danser toutes les générations. La piste de danse était tout le temps remplie !

        Aussi, Pierre nous a aidés dans la préparation du mariage, nous étions en totale confiance : toutes les animations étaient envoyées en amont pour que tout se passe bien le jour J. Pierre a également fait un excellent montage pour notre première danse. Nous avons également rempli un super formulaire pour les musiques « interdites » et les « obligatoires » ; très à l'écoute, Pierre nous a fait passer une soirée magique !
    - initiales: "M. & A."
      date: "Mariage · juin 2025"
      source: google
      portrait: marie-anthony
      texte: |
        Nous avons fait appel à Pierre (Groove Caviar) pour notre mariage et nous en sommes plus que ravis ! Il est très professionnel et à l'écoute, tant pour l'accompagnement dans la préparation du mariage que pour sa performance le jour J (du cocktail à la fin de la soirée). Il a su entendre nos idées tout en nous conseillant dans les bons choix.

        Une gestion parfaite de l'ambiance de la soirée et des playlists qui ont convaincu tous les invités, de toutes les générations. Personne ne voulait quitter la piste de danse. On recommande les yeux fermés et nous ferons appel à lui sans hésiter pour nos prochains événements.
    - initiales: "M. & Y."
      date: "Mariage · octobre 2023"
      source: google
      portrait: maxime-yann
      texte: |
        Nous avons eu la joie de faire appel à Groove Caviar pour l'animation musicale de notre mariage (cocktail, dîner et soirée). La promesse est tenue : un dancefloor rempli du début à la fin, jeunes et moins jeunes confondus.

        La prestation de Groove Caviar fut de très grande qualité. Résultat : des invités ravis dès le cocktail et des mariés enchantés par la musique, l'animation, la disponibilité de Pierre et son professionnalisme impressionnant. À recommander les yeux fermés !
    - initiales: "A. & F."
      date: "Mariage · septembre 2022"
      source: google
      portrait: aurelie-fabrice
      texte: |
        Pierre a animé de main de maître notre mariage. Une préparation de qualité et très professionnelle pour être sûr de répondre au mieux à nos souhaits, ainsi qu'une animation parfaite tout au long du cocktail, puis du repas et enfin de la soirée dansante.

        La piste est restée remplie jusqu'à la dernière musique et les invités en redemandaient. Bravo et merci de nous avoir accompagnés lors de cette journée inoubliable.
  liste:
    - initiales: "L. & J."
      date: "Mariage · septembre 2026"
      source: google
      texte: |
        Un immense merci à Pierre pour avoir rendu notre mariage encore plus incroyable !

        Nous avons passé une soirée exceptionnelle : la playlist était parfaite, la piste de danse n'a jamais désempli et tous nos invités ont adoré l'ambiance. Nous avons dansé et fait la fête jusqu'à la dernière minute !

        Pierre a été d'un grand professionnalisme, toujours souriant et de bonne humeur, avec des transitions impeccables. Nous ne pouvions vraiment pas rêver mieux pour accompagner cette soirée si importante pour nous. Bravo !
    - initiales: "T. & A."
      date: "Mariage · août 2025"
      source: google
      texte: |
        Pierre a animé notre soirée de mariage de manière incroyable ! Beaucoup de monde est resté sur la piste jusqu'au bout, l'ambiance était dingue. Professionnel, rassurant et fluide, tout a été parfait. On recommande vivement !
    - initiales: "P. & H."
      date: "Mariage · août 2026"
      source: google
      texte: |
        Pierre a grandement participé à la réussite de notre mariage, il fait preuve d'un très grand professionnalisme. Du rendez-vous de préparation jusqu'à la dernière chanson de notre soirée, Groove Caviar a su répondre à nos attentes.

        À l'écoute de nos goûts musicaux (et de ceux de nos convives), il a fait danser toutes les générations jusqu'au bout de la nuit sans que la piste ne se vide ! La possibilité de rajouter un saxo est un réel plus.

        Merci beaucoup Pierre, nous recommandons à 100 % !
    - initiales: "M. & B."
      date: "Mariage multiculturel · mai 2025"
      source: google
      texte: |
        Super expérience pour notre mariage, Pierre a été là pour répondre à nos attentes pour un mariage multiculturel. Nous avons beaucoup travaillé en amont pour faire en sorte que tout se passe à merveille. Merci encore !
    - initiales: "M. & Y."
      date: "Mariage multiculturel · août 2024"
      source: google
      texte: |
        Pierre a une démarche méthodique qui comble les plus exigeants en matière de musique. Nous souhaitions garder de l'élégance et de la douceur dans un premier temps, puis poursuivre avec une ambiance pleine d'énergie et de danse pour notre mariage multiculturel.

        Il nous a écoutés et a compris l'essence et l'énergie de chaque moment : nous avons ri, pleuré puis dansé jusqu'au bout de la nuit ! Merci Groove Caviar, nous le recommandons vivement !
    - initiales: "J. & L."
      date: "Mariage · mai 2023"
      source: google
      texte: |
        Pierre a été le DJ de notre mariage. Nous avons été ravis de la qualité de ses services ! Il a été disponible, bienveillant et a su facilement cerner nos attentes. Un monsieur d'une grande gentillesse, jovial et extrêmement sympa !

        Je le recommande à 100 % et le remercie d'avoir fait danser nos invités jusqu'au bout de la nuit.

# ── 6. NOS DJs ─────────────────────────────────────────────────────────
djs:
  surtitre: "Nos DJs"
  titre_blanc: "Trois DJs,"
  titre_or: "une même exigence"
  texte: |
    Chaque mariage Groove Caviar est confié à l'un de nos DJs résidents, choisi selon votre style et votre date. Tous partagent la même méthode : une écoute attentive, une préparation minutieuse, et le plaisir de voir une piste pleine jusqu'au bout de la nuit.
  liste:
    - nom: "Pierre"
      role: "Fondateur"
      photo: dj-pierre
      langues: "FR · EN · ES"
      texte: |
        DJ depuis son adolescence et plus de 150 soirées de mariages à son actif, dont de nombreux mariages internationaux et LGBT+. Des clubs aux châteaux, un DJ qui sait faire danser toutes les générations.
    - nom: "Domi"
      role: "DJ résident Île de France"
      photo: dj-domi
      langues: "FR · EN"
      texte: |
        Avec plus de 10 ans d'expérience derrière les platines, Domi sait parfaitement lire un dancefloor et passer le bon morceau au bon moment. Comptez sur lui pour vous faire danser jusqu'au bout de la nuit ! 
    - nom: "Mike"
