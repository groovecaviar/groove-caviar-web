# ── 7. NOTRE MÉTHODE ───────────────────────────────────────────────────
methode:
  surtitre: "Notre méthode"
  titre_blanc: "Six étapes,"
  titre_or: "zéro stress"
  etapes:
    - titre: "Votre demande"
      texte: "Un formulaire en quelques minutes : vous nous communiquez vos souhaits et les informations relatives à votre événement."
    - titre: "Notre proposition"
      texte: "Nous vérifions votre date, notre capacité à répondre parfaitement à votre vision et vous envoyons un devis personnalisé sous 72 h ouvrées."
    - titre: "Validation, contrat et formulaire de préparation"
      texte: "Vous validez notre engagement en versant des arrhes ce qui bloque la date pour vous dans notre agenda. Nous vous envoyons un contrat d'engagement ainsi qu'un formulaire de préparation qui vous permettra de définir vos souhaits pour l'aspect musical du mariage."
    - titre: "Le rdv préparatoire"
      texte: "En visio ou autour d'un café : ambiance, moments clés, morceaux incontournables… et ceux à ne jamais passer. Nous validons ensemble tous les détails "
    - titre: "Le jour J"
      texte: "Installation discrète avant l'arrivée de vos invités, en lien avec le lieu, le traiteur et votre wedding planner."
    - titre: "La fête"
      texte: "Notre DJ lit votre piste et adapte chaque enchaînement en direct. Vous n'avez plus qu'à danser."

